<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap');
        </style>
        <title>Worshipd</title>
        <link rel="icon" type="image/x-icon" href="assets/logos/logo.svg">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <div class="left-wing">
                <div class="logo"><img src="assets/logos/logo.svg" alt="logo"></div>
                <div><h2>DuckyCCM</h2></div>
            </div>
            <div class="right-wing">
                <div class="buttons">
                    <a href="index.html" class="nav-button-base">PLAY</a>
                    <a href="songlist.html" class="nav-button">SONG LIST</a>
                    <a href="about.html" class="nav-button">INFO</a>
                </div>
                <a href="https://github.com/DuckyBoi-XD/Worshipd" class="github-logo"><img src="assets/logos/github-logo.png" alt="github logo"></a>
            </div>
        </nav>
        <div class="alignment">
            <div class="main-title">
                <div class="box">
                    <h2>Worshipd</h2>
                    <p>Listen to a clip and guess the worship or praise song it is from</p>
                </div>
                <div class="game-buttons">
                    <div class="game-button1-wrapper">
                        <a class="game-button1">CASUAL</a>
                    </div>
                    <div class="game-button2-wrapper">
                        <a class="game-button2">DEVOTED</a>
                    </div>
                    <div class="game-button3-wrapper">
                        <a class="game-button3">WORSHIPER</a>
                    </div>
                </div>
                <div class="game-info">
                    <p class="popout-info1">The song's name is mentioned in the clip</p>
                    <p class="popout-info2">A recognisable part of a song is played</p>
                    <p class="popout-info3">The start of the song or bridge will be given</p>
                </div>
            </div>
        </div>
    </body>
</html>
